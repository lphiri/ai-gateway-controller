apiVersion: kuadrant.io/v1
kind: AuthPolicy
metadata:
  name: maas-consumer-portal-oauth2-anonymous
  labels:
    app.kubernetes.io/name: maas-consumer-portal-oauth2
    app.kubernetes.io/part-of: maas-consumer-portal
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: maas-consumer-portal-oauth2
  rules:
    authentication:
      public-login:
        anonymous: {}
---
apiVersion: kuadrant.io/v1
kind: AuthPolicy
metadata:
  name: maas-consumer-portal-session
  labels:
    app.kubernetes.io/name: maas-consumer-portal
    app.kubernetes.io/part-of: maas-consumer-portal
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: maas-consumer-portal
  rules:
    authentication:
      # A BFF may present the user access token directly; a browser presents
      # the proxy session cookie (no Authorization header).
      direct-jwt:
        priority: 0
        jwt:
          issuerUrl: CONSUMER_PORTAL_OIDC_ISSUER_URL
          ttl: 300
        credentials:
          authorizationHeader:
            prefix: Bearer
      browser:
        priority: 1
        when:
          - predicate: '!has(request.headers.authorization)'
        anonymous: {}
    authorization:
      session-and-identity:
        priority: 0
        opa:
          allValues: true
          rego: |
            allow {
              identity_safe
            }

            login_location := sprintf("/oauth2/start?rd=%s", [urlquery.encode(input.context.request.http.path)])

            # Only application cookies reach the BFF; the proxy session
            # cookie(s) are stripped from the forwarded request.
            application_cookies := concat("; ", [entry |
              raw := split(object.get(input.context.request.http.headers, "cookie", ""), ";")[_]
              entry := trim_space(raw)
              entry != ""
              name := trim_space(split(entry, "=")[0])
              not startswith(name, "_maas_consumer_proxy")
            ])

            # MS-0007 flattened contract: the organization identity is carried
            # as flat scalar/array claims (org_id, org_name, roles), not the
            # superseded https://redhat.com/maas/orgs array-of-objects.
            organization = result {
              org_id := object.get(organization_claims, "org_id", "")
              is_string(org_id)
              org_id != ""
              roles := object.get(organization_claims, "roles", [])
              is_array(roles)
              result := {
                "org_id": org_id,
                "roles_header": json.marshal(roles)
              }
            } else = {"org_id": "", "roles_header": "[]"}

            # The claims object is passed through whole, so the flat
            # org_id/org_name/roles claims are read the same way on both the
            # Authorino-validated path and the decoded-token path.
            organization_claims = claims {
              not input.auth.identity.anonymous
              claims := input.auth.identity
            } else = claims {
              identity.authenticated
              [_, claims, _] := io.jwt.decode(identity.id_token)
            } else = {}

            # Group qualification and validation mirror celOIDCTransportGroups
            # and oidc-groups-safe:
            # https://github.com/opendatahub-io/models-as-a-service/blob/fdfdff2871b587e8bc48e222278131e8762cd199/maas-controller/pkg/controller/maas/maasauthpolicy_controller.go#L418-L421
            # https://github.com/opendatahub-io/models-as-a-service/blob/fdfdff2871b587e8bc48e222278131e8762cd199/maas-controller/pkg/controller/maas/maasauthpolicy_controller.go#L1058-L1166
            groups_header(groups, org_id) := header {
              org_id != ""
              qualified_groups := {sprintf("%s/%s", [org_id, group]) |
                group := groups[_]
              }
              header := json.marshal(array.concat(["system:authenticated"], sort(qualified_groups)))
            } else := header {
              header := json.marshal(array.concat(["system:authenticated"], sort(groups)))
            }

            identity = result {
              not input.auth.identity.anonymous
              claims := input.auth.identity
              usernames := [user |
                user := [object.get(claims, "preferred_username", ""), object.get(claims, "sub", "")][_]
                user != ""
              ]
              username := usernames[0]
              authorization := input.context.request.http.headers.authorization
              org_id := object.get(claims, "org_id", "")
              groups := object.get(claims, "groups", [])
              # MS-0007: group names are qualified with the organization ID.
              result := {
                "authenticated": true,
                "authorization": authorization,
                # The presented token, forwarded as-is under
                # x-forwarded-id-token (MS-0007).
                "id_token": trim_prefix(authorization, "Bearer "),
                "username": username,
                "email": object.get(claims, "email", ""),
                "groups": groups,
                "groups_header": groups_header(groups, org_id)
              }
            } else = result {
              input.auth.identity.anonymous
              cookie := object.get(input.context.request.http.headers, "cookie", "")
              cookie != ""
              response := http.send({
                "method": "GET",
                "url": "CONSUMER_PORTAL_PROXY_URL",
                "headers": {"Cookie": cookie},
                "tls_ca_cert_file": "/var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt",
                "timeout": "2s",
                "cache": false,
                "enable_redirect": false,
                "raise_error": false
              })
              {200, 202}[response.status_code]
              # TODO(MS-0007): x-forwarded-id-token should carry the ID
              # token, but this kube-auth-proxy build has no ID-token
              # pass-through (no --pass-id-token* flag, no
              # x-auth-request-id-token response header), so the session path
              # forwards the access token under the new header name. Switch
              # to x-auth-request-id-token when the proxy supports it.
              token := object.get(response.headers, "x-auth-request-access-token", [""])[0]
              usernames := [user |
                user := [object.get(response.headers, "x-auth-request-preferred-username", [""])[0], object.get(response.headers, "x-auth-request-user", [""])[0]][_]
                user != ""
              ]
              username := usernames[0]
              token != ""
              [_, claims, _] := io.jwt.decode(token)
              org_id := object.get(claims, "org_id", "")
              groups := object.get(claims, "groups", [])
              result := {
                "authenticated": true,
                # The verified token replaces any client-supplied value on
                # the session path (MS-0007 SSO flow).
                "authorization": concat("", ["Bearer ", token]),
                "id_token": token,
                "username": username,
                "email": object.get(response.headers, "x-auth-request-email", [""])[0],
                "groups": groups,
                "groups_header": groups_header(groups, org_id)
              }
            } else = {"authenticated": false}

            identity_safe {
              identity.authenticated
              organization.org_id != ""
              regex.match("^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$", organization.org_id)
              is_array(identity.groups)
              count(identity.groups) <= 128
              count({group | group := identity.groups[_]}) == count(identity.groups)
              count(unsafe_group) == 0
            }

            unsafe_group[group] {
              group := identity.groups[_]
              not is_string(group)
            }

            unsafe_group[group] {
              group := identity.groups[_]
              is_string(group)
              not regex.match("^[A-Za-z0-9:#._/ -]+$", group)
            }

            unsafe_group[group] {
              group := identity.groups[_]
              is_string(group)
              regex.match("^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}/", group)
            }

            unsafe_group[group] {
              group := identity.groups[_]
              is_string(group)
              encoded := base64.encode(group)
              count(encoded) > 344
            }

            unsafe_group[group] {
              group := identity.groups[_]
              is_string(group)
              encoded := base64.encode(group)
              count(encoded) == 344
              not regex.match("==$", encoded)
            }
      require-auth:
        priority: 1
        patternMatching:
          patterns:
            - predicate: auth.authorization['session-and-identity'].identity.authenticated
      client-bound:
        priority: 1
        when:
          # Check the claim's value, not its presence: the direct-jwt rule
          # authenticates any signed token, and a token carrying
          # "anonymous": false would otherwise skip the iss/azp binding.
          - predicate: '!has(auth.identity.anonymous) || auth.identity.anonymous == false'
        patternMatching:
          patterns:
            - predicate: has(auth.identity.iss) && auth.identity.iss == 'CONSUMER_PORTAL_OIDC_ISSUER_URL'
            - predicate: has(auth.identity.azp) && auth.identity.azp == 'CONSUMER_PORTAL_CLIENT_ID'
    response:
      success:
        headers:
          authorization:
            plain:
              expression: auth.authorization['session-and-identity'].identity.authorization
          x-maas-username:
            plain:
              expression: auth.authorization['session-and-identity'].identity.username
          x-maas-group:
            plain:
              expression: auth.authorization['session-and-identity'].identity.groups_header
          x-maas-orgid:
            plain:
              expression: auth.authorization['session-and-identity'].organization.org_id
          x-maas-roles:
            plain:
              expression: auth.authorization['session-and-identity'].organization.roles_header
          x-auth-request-user:
            plain:
              expression: auth.authorization['session-and-identity'].identity.username
          x-auth-request-email:
            plain:
              expression: auth.authorization['session-and-identity'].identity.email
          x-forwarded-id-token:
            plain:
              expression: auth.authorization['session-and-identity'].identity.id_token
          cookie:
            plain:
              expression: auth.authorization['session-and-identity'].application_cookies
      unauthenticated:
        code: 401
        message:
          value: Invalid bearer token
      unauthorized:
        code: 302
        message:
          value: Redirecting to login
        headers:
          Location:
            expression: |
              has(auth.authorization) && 'session-and-identity' in auth.authorization ? auth.authorization['session-and-identity'].login_location : '/oauth2/start?rd=%2Fmaas-portal%2F'
          Cache-Control:
            value: no-store
